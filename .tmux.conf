# Dark blue/gray tmux configuration shared across WSL, Linux, and macOS.

# General
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Prefer tmux's terminfo entry when the host provides it, with a widely
# available fallback for older macOS and minimal Linux installations.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
	'set -g default-terminal "tmux-256color"' \
	'set -g default-terminal "screen-256color"'
set -ag terminal-overrides ',xterm-256color:RGB'
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g display-time 2000
set -g mouse on

# Keybindings
bind r source-file ~/.tmux.conf \; display 'Config reloaded'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind > swap-pane -D
bind < swap-pane -U

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel '~/.tmux/status.sh clipboard'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel '~/.tmux/status.sh clipboard'

bind -r p previous-window
bind -r n next-window

setw -g monitor-activity on
set -g visual-activity off

# Theme
# bg_dark #1a1b26, bg_mid #24283b, bg_light #414868
# fg #a9b1d6, blue #7aa2f7, cyan #7dcfff, green #9ece6a,
# yellow #e0af68, red #f7768e, purple #bb9af7
set -g status-position bottom
set -g status-interval 5
set -g status-style 'bg=#1a1b26,fg=#a9b1d6'
set -g status-justify left

set -g status-left-length 30
set -g status-left '#[fg=#1a1b26,bg=#7aa2f7,bold]  #S #[fg=#7aa2f7,bg=#1a1b26,nobold] '

set -g status-right-length 200
set -g status-right '\
#[fg=#9ece6a]#(~/.tmux/status.sh git #{pane_current_path})\
#[fg=#414868] | \
#[fg=#7dcfff]CPU #(~/.tmux/status.sh cpu)\
#[fg=#414868] | \
#[fg=#7aa2f7]RAM #(~/.tmux/status.sh mem)\
#[fg=#bb9af7]#(~/.tmux/status.sh gpu)\
#[fg=#414868] | \
#[fg=#e0af68]DSK #(~/.tmux/status.sh disk)\
#[fg=#414868] | \
#[fg=#a9b1d6]UP #(~/.tmux/status.sh uptime)\
#[fg=#414868] | \
#[fg=#a9b1d6,bold]%d %b %H:%M '

setw -g window-status-format '#[fg=#606880,bg=#1a1b26] #I:#W '
setw -g window-status-current-format '#[fg=#1a1b26,bg=#7aa2f7,bold] #I:#W #[fg=#7aa2f7,bg=#1a1b26,nobold]'
setw -g window-status-separator ''
setw -g window-status-activity-style 'fg=#e0af68,bg=#1a1b26'

set -g pane-border-style 'fg=#414868'
set -g pane-active-border-style 'fg=#7aa2f7'

set -g message-style 'bg=#24283b,fg=#7aa2f7'
set -g message-command-style 'bg=#24283b,fg=#7aa2f7'
setw -g mode-style 'bg=#364a82,fg=#a9b1d6'
setw -g clock-mode-colour '#7aa2f7'
